# Deploy del catálogo estático a GitHub Pages (sitio de usuario).
# Compila el build de producción y publica dist/cafe-cacao-static/browser/.
#
# Requisitos en el repo que publica: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11.x, la versión que declara `packageManager`
          # de package.json. Node 22 (npm 10) falla el `npm ci` con el
          # lockfile regenerado por npm 11.
          node-version: 24
          cache: npm

      - name: Install dependencies
        # `npm install` y no `npm ci`: el lock se regenera en Windows y npm
        # valida distinto entre versiones/plataformas los bindings nativos
        # opcionales (@rolldown/@emnapi); apagar dependencias ignorando lock
        # es la sincronizacion del paso interno del runner.
        run: npm install --no-audit --no-fund

      - name: Build (production)
        run: npm run build

      # Defensivo: evita que Jekyll interfiera si el método de publicación
      # cambia algún día a deploy-from-branch.
      - name: Add .nojekyll
        run: touch dist/cafe-cacao-static/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cafe-cacao-static/browser

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
