<footer class="main-footer">
  <div class="footer-content">
    <p class="copyright">
      &copy; {{ anio }} {{ nombreEmpresa }}. Todos los derechos reservados.
    </p>

    <nav class="social-nav" aria-label="Redes sociales">
      @for (red of redesSociales; track red.nombre) {
        @if (red.url; as url) {
          <a [href]="url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="red.ariaLabel" class="social-link">
            <i [class]="red.iconoClase" aria-hidden="true"></i>
          </a>
        } @else {
          <span class="social-link social-link--disabled" [attr.aria-label]="red.ariaLabel" aria-disabled="true">
            <i [class]="red.iconoClase" aria-hidden="true"></i>
          </span>
        }
      }
    </nav>
  </div>
</footer>
